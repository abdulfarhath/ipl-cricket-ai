<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPL Intelligence Agent</title>
<style>
  :root{
    --ink:#eef5ef; --muted:#9fb3a6; --accent:#37d07e; --accent-dark:#1f8f55;
    --panel:rgba(10,26,18,.78); --user:rgba(23,70,44,.85); --line:rgba(122,180,146,.25);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--ink);
    font:16px/1.6 system-ui,Segoe UI,Roboto,sans-serif;
    display:flex; flex-direction:column; height:100dvh;
    background:
      /* floodlight glows */
      radial-gradient(38rem 22rem at 8% -5%, rgba(255,244,200,.14), transparent 60%),
      radial-gradient(38rem 22rem at 92% -5%, rgba(255,244,200,.14), transparent 60%),
      /* pitch strip at the bottom */
      linear-gradient(to top, rgba(196,166,102,.18) 0, transparent 22%),
      /* night stadium ground */
      radial-gradient(120% 90% at 50% 0%, #12301f 0%, #0b2015 45%, #071510 100%);
    background-attachment: fixed;
  }
  /* cricket pattern layer: stumps + ball, faint, repeated */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.10; z-index:0;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220"><g stroke="%23bfe6cf" fill="none" stroke-width="3"><rect x="30" y="26" width="7" height="60" rx="3"/><rect x="45" y="26" width="7" height="60" rx="3"/><rect x="60" y="26" width="7" height="60" rx="3"/><rect x="31" y="20" width="16" height="5" rx="2"/><rect x="50" y="20" width="16" height="5" rx="2"/><circle cx="160" cy="150" r="26"/><path d="M142 132 q18 18 36 36"/><path d="M138 140 q18 18 36 36" stroke-dasharray="4 5"/><path d="M146 126 q18 18 36 36" stroke-dasharray="4 5"/></g></svg>');
    background-size:220px 220px;
  }
  header{
    position:relative; z-index:1;
    padding:.9rem 1.2rem; display:flex; align-items:center; gap:.7rem;
    background:rgba(6,17,12,.72); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  header .logo{font-size:1.5rem}
  header h1{font-size:1.1rem; margin:0; letter-spacing:.02em}
  header span{color:var(--muted); font-size:.8rem}
  #log{
    position:relative; z-index:1;
    flex:1; overflow-y:auto; padding:1.4rem 1rem;
    display:flex; flex-direction:column; gap:.9rem;
    max-width:62rem; width:100%; margin:0 auto;
    scroll-behavior:smooth;
  }
  .msg{
    padding:.8rem 1.05rem; border-radius:14px; white-space:pre-wrap;
    max-width:92%; overflow-x:auto; backdrop-filter:blur(4px);
    border:1px solid var(--line); font-size:1.02rem;
  }
  .user{background:var(--user); align-self:flex-end; border-bottom-right-radius:4px}
  .bot{background:var(--panel); align-self:flex-start; border-bottom-left-radius:4px}
  .meta{font-size:.7rem; color:var(--muted); margin-top:.4rem}
  .bot table{border-collapse:collapse; margin:.4rem 0}
  .bot td,.bot th{border:1px solid var(--line); padding:.28rem .55rem; font-size:.88rem}
  .hint{align-self:center; color:var(--muted); font-size:.85rem; text-align:center;
        background:rgba(6,17,12,.55); border-radius:10px; padding:.6rem 1rem}
  form{
    position:relative; z-index:1;
    display:flex; gap:.55rem; padding:.9rem 1rem 1.1rem;
    max-width:62rem; width:100%; margin:0 auto;
  }
  input{
    flex:1; background:rgba(8,22,15,.85); border:1px solid var(--line);
    color:var(--ink); border-radius:12px; padding:.75rem .95rem; font-size:1.03rem;
    backdrop-filter:blur(6px);
  }
  input::placeholder{color:var(--muted)}
  input:focus{outline:2px solid var(--accent)}
  button{
    background:linear-gradient(180deg,var(--accent),var(--accent-dark));
    border:0; color:#04130a; font-weight:800; border-radius:12px;
    padding:0 1.4rem; font-size:1.03rem; cursor:pointer;
  }
  button:disabled{opacity:.5}
  .err{color:#ff9a8f}
  @media (max-width:600px){ .msg{max-width:100%} }
  @media (prefers-reduced-motion: reduce){ #log{scroll-behavior:auto} }
</style>
</head>
<body>
<header>
  <span class="logo">🏏</span>
  <div>
    <h1>IPL Intelligence Agent</h1>
    <span>2008 – Dec 2025 · every stat from the database, never invented</span>
  </div>
</header>
<div id="log">
  <div class="hint">Ask anything about IPL history — try
    “What is Virat Kohli's highest IPL score?” ·
    “Compare Kohli and Rohit” ·
    “Who won the Purple Cap in 2025?”</div>
</div>
<form id="f">
  <input id="q" placeholder="Ask an IPL question…" autocomplete="off" autofocus>
  <button id="send">Ask</button>
</form>
<script>
const log = document.getElementById('log'), f = document.getElementById('f'),
      q = document.getElementById('q'), send = document.getElementById('send');
const history = [];

function add(cls, text) {
  const m = document.createElement('div');
  m.className = 'msg ' + cls;
  m.textContent = text;
  log.appendChild(m); log.scrollTop = log.scrollHeight;
  return m;
}

f.addEventListener('submit', async e => {
  e.preventDefault();
  const question = q.value.trim();
  if (!question) return;
  add('user', question); q.value = ''; send.disabled = true;
  const thinking = add('bot', 'Thinking…');
  try {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: {'content-type': 'application/json'},
      body: JSON.stringify({question, history})
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    thinking.textContent = d.answer;
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = (d.latency_ms / 1000).toFixed(1) + ' s' + (d.cached ? ' · cached' : '');
    thinking.appendChild(meta);
    log.scrollTop = log.scrollHeight;
    history.push({role: 'user', content: question},
                 {role: 'assistant', content: d.answer});
    if (history.length > 10) history.splice(0, history.length - 10);
  } catch (err) {
    thinking.textContent = 'Error: ' + err.message;
    thinking.classList.add('err');
  } finally { send.disabled = false; q.focus(); }
});
</script>
</body>
</html>
