<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPL Intelligence Agent</title>
<style>
  :root{--bg:#0e1512;--panel:#18211c;--ink:#e8efe9;--muted:#8fa397;
        --accent:#2fbf71;--user:#1d3b2c;--line:#243029}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 system-ui,Segoe UI,Roboto,sans-serif;
       display:flex;flex-direction:column;height:100dvh}
  header{padding:.9rem 1.2rem;border-bottom:1px solid var(--line);
         display:flex;align-items:center;gap:.6rem}
  header h1{font-size:1.05rem;margin:0}
  header span{color:var(--muted);font-size:.8rem}
  #log{flex:1;overflow-y:auto;padding:1rem;display:flex;
       flex-direction:column;gap:.7rem;max-width:52rem;width:100%;margin:0 auto}
  .msg{padding:.65rem .9rem;border-radius:10px;white-space:pre-wrap;
       max-width:88%;overflow-x:auto}
  .user{background:var(--user);align-self:flex-end}
  .bot{background:var(--panel);align-self:flex-start}
  .meta{font-size:.72rem;color:var(--muted);margin-top:.35rem}
  .bot table{border-collapse:collapse;margin:.4rem 0}
  .bot td,.bot th{border:1px solid var(--line);padding:.25rem .5rem;font-size:.85rem}
  form{display:flex;gap:.5rem;padding:.8rem;border-top:1px solid var(--line);
       max-width:52rem;width:100%;margin:0 auto}
  input{flex:1;background:var(--panel);border:1px solid var(--line);
        color:var(--ink);border-radius:8px;padding:.65rem .8rem;font-size:1rem}
  input:focus{outline:2px solid var(--accent)}
  button{background:var(--accent);border:0;color:#08130c;font-weight:700;
         border-radius:8px;padding:0 1.2rem;font-size:1rem;cursor:pointer}
  button:disabled{opacity:.5}
  .err{color:#ff8a80}
</style>
</head>
<body>
<header><h1>🏏 IPL Intelligence Agent</h1><span>2008 – Dec 2025 · grounded stats, zero hallucination</span></header>
<div id="log"></div>
<form id="f">
  <input id="q" placeholder="e.g. What is Virat Kohli's highest IPL score?" autocomplete="off" autofocus>
  <button id="send">Ask</button>
</form>
<script>
const log = document.getElementById('log'), f = document.getElementById('f'),
      q = document.getElementById('q'), send = document.getElementById('send');
const history = [];

function add(cls, text, meta) {
  const m = document.createElement('div');
  m.className = 'msg ' + cls;
  m.textContent = text;
  if (meta) {
    const d = document.createElement('div');
    d.className = 'meta'; d.textContent = meta; m.appendChild(d);
  }
  log.appendChild(m); log.scrollTop = log.scrollHeight;
  return m;
}

f.addEventListener('submit', async e => {
  e.preventDefault();
  const question = q.value.trim();
  if (!question) return;
  add('user', question); q.value = ''; send.disabled = true;
  const thinking = add('bot', 'Thinking…');
  try {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: {'content-type': 'application/json'},
      body: JSON.stringify({question, history})
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    thinking.textContent = d.answer;
    const tools = (d.trace || []).map(t => t.tool).join(', ');
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = `${d.latency_ms} ms · intent: ${d.intent || '—'}` +
      (d.cached ? ' · cached' : '') + (tools ? ` · tools: ${tools}` : '');
    thinking.appendChild(meta);
    history.push({role: 'user', content: question},
                 {role: 'assistant', content: d.answer});
    if (history.length > 10) history.splice(0, history.length - 10);
  } catch (err) {
    thinking.textContent = 'Error: ' + err.message;
    thinking.classList.add('err');
  } finally { send.disabled = false; q.focus(); }
});
</script>
</body>
</html>
