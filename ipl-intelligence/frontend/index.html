<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPL Intelligence Agent</title>
<style>
  :root{
    --ink:#eef2fa; --muted:#93a3bd; --accent:#f0b93c; --accent-dark:#b8862a;
    --panel:#101d33; --panel-2:#0c1729; --user:#1a2f55;
    --line:rgba(140,170,220,.22); --gold:#f0b93c;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--ink);
    font:16px/1.65 "Segoe UI",system-ui,Roboto,sans-serif;
    display:flex; flex-direction:column; height:100dvh;
    background:
      radial-gradient(60rem 30rem at 50% -12rem, rgba(100,150,255,.15), transparent 70%),
      linear-gradient(160deg, #0d1a38 0%, #091226 45%, #050b18 100%);
    background-attachment:fixed;
  }
  /* subtle outfield mowing stripes — the professional cricket touch */
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:repeating-linear-gradient(90deg,
      rgba(255,255,255,.020) 0 70px, rgba(0,0,0,.028) 70px 140px);
  }
  header{
    position:relative; z-index:2;
    padding:1rem 1.4rem; display:flex; align-items:center; gap:.85rem;
    background:linear-gradient(180deg, rgba(6,11,22,.92), rgba(6,11,22,.78));
    border-bottom:1px solid var(--line); backdrop-filter:blur(8px);
  }
  .voice-toggle{
    margin-left:auto; background:transparent; border:1px solid var(--line);
    color:var(--muted); border-radius:10px; padding:.45rem .8rem; font-size:1rem;
    cursor:pointer;
  }
  .voice-toggle[aria-pressed="true"]{color:var(--gold); border-color:var(--gold)}
  .crest{
    width:2.6rem; height:2.6rem; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:1.35rem;
    background:radial-gradient(circle at 32% 30%, #2c4a86, #12234a);
    border:2px solid var(--gold); box-shadow:0 2px 10px rgba(0,0,0,.45);
  }
  header h1{font-size:1.06rem; margin:0; letter-spacing:.14em; text-transform:uppercase}
  header h1 b{color:var(--accent)}
  header span{color:var(--muted); font-size:.78rem; letter-spacing:.02em}
  #log{
    position:relative; z-index:1;
    flex:1; overflow-y:auto; padding:1.6rem 1rem 1rem;
    display:flex; flex-direction:column; gap:1rem;
    max-width:56rem; width:100%; margin:0 auto;
  }
  .msg{
    padding:.9rem 1.15rem; border-radius:14px;
    max-width:94%; border:1px solid var(--line);
    box-shadow:0 3px 14px rgba(0,0,0,.30);
    overflow-wrap:anywhere;
  }
  .user{background:var(--user); align-self:flex-end; border-bottom-right-radius:4px}
  .bot{background:linear-gradient(180deg, var(--panel), var(--panel-2));
       align-self:flex-start; border-bottom-left-radius:4px}
  .bot h3{margin:.85rem 0 .3rem; font-size:.82rem; letter-spacing:.12em;
          text-transform:uppercase; color:var(--gold)}
  .bot p{margin:.3rem 0}
  .bot ul{margin:.25rem 0 .4rem; padding-left:1.25rem}
  .bot li{margin:.18rem 0}
  .bot b{color:#f4e3b4}
  .tablewrap{overflow-x:auto; margin:.5rem 0}
  .bot table{border-collapse:collapse; min-width:60%}
  .bot th{background:rgba(240,185,60,.12); color:#f4e3b4}
  .bot td,.bot th{border:1px solid var(--line); padding:.35rem .7rem; font-size:.9rem;
                  font-variant-numeric:tabular-nums}
  .src{margin-top:.6rem; font-size:.74rem; color:var(--muted);
       border-top:1px solid var(--line); padding-top:.45rem}
  .meta{font-size:.7rem; color:var(--muted); margin-top:.45rem}
  .hint{align-self:center; color:var(--muted); font-size:.86rem; text-align:center;
        max-width:34rem; background:rgba(8,20,13,.6); border:1px solid var(--line);
        border-radius:12px; padding:.8rem 1.1rem}
  .hint b{color:var(--ink)}
  form{
    position:relative; z-index:2;
    display:flex; gap:.6rem; padding:1rem 1rem 1.25rem;
    max-width:56rem; width:100%; margin:0 auto;
  }
  input{
    flex:1; background:rgba(8,22,14,.92); border:1px solid var(--line);
    color:var(--ink); border-radius:12px; padding:.8rem 1rem; font-size:1.02rem;
  }
  input::placeholder{color:var(--muted)}
  input:focus{outline:2px solid var(--accent)}
  button{
    background:linear-gradient(180deg, var(--accent), var(--accent-dark));
    border:0; color:#140d02; font-weight:800; border-radius:12px;
    padding:0 1.5rem; font-size:1.02rem; cursor:pointer; letter-spacing:.03em;
  }
  button:disabled{opacity:.5}
  #mic{
    background:transparent; border:1px solid var(--line); color:var(--muted);
    border-radius:12px; padding:0 .95rem; font-size:1.25rem;
  }
  #mic.listening{color:#ff6b5e; border-color:#ff6b5e; animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.45}}
  @media (prefers-reduced-motion: reduce){#mic.listening{animation:none}}
  .err{color:#ff9a8f}
  @media (max-width:600px){ .msg{max-width:100%} header h1{font-size:.95rem} }
</style>
</head>
<body>
<header>
  <div class="crest">🏏</div>
  <div>
    <h1>IPL <b>Intelligence</b> Agent</h1>
    <span>Indian Premier League · 2008 – Dec 2025 · every statistic from the database, never invented</span>
  </div>
  <button id="speaker" class="voice-toggle" aria-pressed="false"
          title="Read answers aloud">🔊 Voice replies</button>
</header>
<div id="log">
  <div class="hint"><b>Ask anything about IPL history.</b><br>
    “What is Virat Kohli's highest IPL score?” · “Compare Kohli and Rohit” ·
    “Fastest fifty in IPL history?” · “Who umpired the most matches?”</div>
</div>
<form id="f">
  <button type="button" id="mic" title="Ask by voice">🎤</button>
  <input id="q" placeholder="Ask an IPL question — type or tap the mic…" autocomplete="off" autofocus>
  <button id="send">Ask</button>
</form>
<script>
const log = document.getElementById('log'), f = document.getElementById('f'),
      q = document.getElementById('q'), send = document.getElementById('send');
const history = [];

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* minimal offline markdown renderer: headers, bold, bullets, tables, source line */
function md(text) {
  const lines = esc(text).split('\n');
  let html = '', inList = false, tableRows = [];
  const flushList = () => { if (inList) { html += '</ul>'; inList = false; } };
  const flushTable = () => {
    if (!tableRows.length) return;
    const rows = tableRows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
    html += '<div class="tablewrap"><table>';
    rows.forEach((r, i) => {
      const cells = r.replace(/^\s*\||\|\s*$/g, '').split('|');
      const tag = i === 0 ? 'th' : 'td';
      html += '<tr>' + cells.map(c =>
        `<${tag}>${inline(c.trim())}</${tag}>`).join('') + '</tr>';
    });
    html += '</table></div>';
    tableRows = [];
  };
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
                       .replace(/\*(.+?)\*/g, '<i>$1</i>');
  for (const line of lines) {
    if (/^\s*\|.*\|\s*$/.test(line)) { flushList(); tableRows.push(line); continue; }
    flushTable();
    const h = line.match(/^\s{0,3}#{1,4}\s+(.*)/);
    const li = line.match(/^\s*[-*•]\s+(.*)/);
    if (h) { flushList(); html += `<h3>${inline(h[1])}</h3>`; }
    else if (li) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${inline(li[1])}</li>`; }
    else if (/^\s*source\s*:/i.test(line)) { flushList(); html += `<div class="src">${inline(line.trim())}</div>`; }
    else if (line.trim() === '') { flushList(); }
    else { flushList(); html += `<p>${inline(line)}</p>`; }
  }
  flushList(); flushTable();
  return html;
}

/* ---- voice: browser speech APIs, no keys, no extra latency ---- */
const mic = document.getElementById('mic'), speaker = document.getElementById('speaker');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let speakReplies = false, askedByVoice = false, listening = false;

/* status toast so voice problems are visible, never silent */
const toast = document.createElement('div');
toast.style.cssText = 'position:fixed;bottom:5.2rem;left:50%;transform:translateX(-50%);' +
  'background:rgba(8,14,28,.95);color:#eef2fa;border:1px solid rgba(240,185,60,.5);' +
  'border-radius:10px;padding:.5rem 1rem;font-size:.85rem;z-index:9;display:none;max-width:90%';
document.body.appendChild(toast);
let toastTimer;
function note(msg, ms = 3500) {
  toast.textContent = msg; toast.style.display = 'block';
  clearTimeout(toastTimer);
  if (ms) toastTimer = setTimeout(() => toast.style.display = 'none', ms);
}

/* voices load asynchronously in Chrome — warm them up early */
let voices = [];
function loadVoices() { voices = speechSynthesis.getVoices() || []; }
if ('speechSynthesis' in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

const MIC_ERRORS = {
  'not-allowed': 'Microphone blocked. Click the 🔒/🎙 icon in the address bar and Allow microphone, then try again.',
  'service-not-allowed': 'Speech service blocked by the browser. Use Chrome or Edge.',
  'no-speech': 'No speech heard — tap 🎤 and speak clearly.',
  'audio-capture': 'No microphone found. Check Windows sound settings.',
  'network': 'Speech-to-text needs internet (browser sends audio to its speech service). Check connection.',
  'aborted': 'Listening cancelled.',
};

if (!SR) {
  mic.style.display = 'none';
  note('Voice input needs Chrome or Edge — this browser does not support it.', 6000);
} else {
  const rec = new SR();
  rec.lang = 'en-IN'; rec.interimResults = false; rec.maxAlternatives = 1;
  mic.addEventListener('click', () => {
    if (listening) { rec.abort(); return; }
    speechSynthesis.cancel();
    try {
      rec.start(); listening = true;
      mic.classList.add('listening'); mic.textContent = '👂';
      note('Listening… speak your question', 0);
    } catch (e) { note('Could not start microphone: ' + e.message); }
  });
  rec.onresult = e => {
    q.value = e.results[0][0].transcript;
    note('Heard: "' + q.value + '"');
    askedByVoice = true;
    f.requestSubmit();
  };
  rec.onend = () => {
    listening = false;
    mic.classList.remove('listening'); mic.textContent = '🎤';
    if (toast.textContent.startsWith('Listening')) toast.style.display = 'none';
  };
  rec.onerror = e => {
    listening = false;
    mic.classList.remove('listening'); mic.textContent = '🎤';
    note(MIC_ERRORS[e.error] || ('Voice input error: ' + e.error), 6000);
  };
}

speaker.addEventListener('click', () => {
  speakReplies = !speakReplies;
  speaker.setAttribute('aria-pressed', String(speakReplies));
  if (speakReplies) {
    speak('Voice replies on.');   // user-gesture test: you must hear this
  } else { speechSynthesis.cancel(); }
});

function speak(text) {
  if (!('speechSynthesis' in window)) { note('This browser cannot speak answers.'); return; }
  speechSynthesis.cancel();
  const clean = text.replace(/[*#|_`]/g, ' ').replace(/^\s*source\s*:.*$/gim, '')
                    .replace(/\s+/g, ' ').trim();
  /* chunk sentences — long single utterances go silent in Chrome */
  const chunks = clean.match(/[^.!?]+[.!?]?/g) || [clean];
  loadVoices();
  const v = voices.find(x => x.lang === 'en-IN') ||
            voices.find(x => x.lang.startsWith('en')) || null;
  chunks.slice(0, 12).forEach(c => {
    const u = new SpeechSynthesisUtterance(c.trim());
    if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'en-US'; }
    u.rate = 1.02;
    speechSynthesis.speak(u);
  });
  /* Chrome pauses long speech after ~15s — keep it alive */
  const keepAlive = setInterval(() => {
    if (!speechSynthesis.speaking) { clearInterval(keepAlive); return; }
    speechSynthesis.pause(); speechSynthesis.resume();
  }, 12000);
}

function add(cls, text) {
  const m = document.createElement('div');
  m.className = 'msg ' + cls;
  m.textContent = text;
  log.appendChild(m); log.scrollTop = log.scrollHeight;
  return m;
}

f.addEventListener('submit', async e => {
  e.preventDefault();
  const question = q.value.trim();
  if (!question) return;
  add('user', question); q.value = ''; send.disabled = true;
  const thinking = add('bot', 'Thinking…');
  try {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: {'content-type': 'application/json'},
      body: JSON.stringify({question, history})
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    thinking.innerHTML = md(d.answer);
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = (d.latency_ms / 1000).toFixed(1) + ' s' + (d.cached ? ' · cached' : '');
    thinking.appendChild(meta);
    log.scrollTop = log.scrollHeight;
    if (speakReplies || askedByVoice) speak(d.answer);
    askedByVoice = false;
    history.push({role: 'user', content: question},
                 {role: 'assistant', content: d.answer});
    if (history.length > 10) history.splice(0, history.length - 10);
  } catch (err) {
    thinking.textContent = 'Error: ' + err.message;
    thinking.classList.add('err');
  } finally { send.disabled = false; q.focus(); }
});
</script>
</body>
</html>
